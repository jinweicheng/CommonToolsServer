spring:
  application:
    name: CommonTools Server
  
  # 数据库配置
  # 选项1: H2内存数据库（数据重启后丢失，仅用于快速测试）
  # url: jdbc:h2:mem:commontoolsdb
  
  # 选项2: H2文件数据库（数据持久化，推荐用于开发环境）
  # datasource:
  #   url: jdbc:h2:file:./data/commontools;AUTO_SERVER=TRUE
  #   driver-class-name: org.h2.Driver
  #   username: root
  #   password: root
  
  # 选项3: MySQL数据库（推荐用于生产环境）
  datasource:
    url: jdbc:mysql://localhost:3306/commontools?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    # HikariCP连接池配置 - 优化数据库连接
    hikari:
      maximum-pool-size: 20              # 最大连接数
      minimum-idle: 5                    # 最小空闲连接数
      connection-timeout: 30000          # 连接超时时间（毫秒）
      idle-timeout: 600000               # 连接最大空闲时间（毫秒）
      max-lifetime: 1800000              # 连接最大生命周期（毫秒）
      auto-commit: true                  # 自动提交
      leak-detection-threshold: 60000    # 连接泄漏检测阈值（毫秒）
  
  h2:
    console:
      enabled: true
      path: /h2-console

  # OAuth2 配置迁移到 application-oauth.yml（oauth profile）
  # Optional: GitHub OAuth2 client configuration (read from environment variables)
  # If you prefer to use the `oauth` profile file (application-oauth.yml), keep that.
  # This block lets the app register the GitHub client when env vars are provided,
  # so you can enable OAuth without activating the 'oauth' profile.
  # OAuth2 configuration is managed in 'application-oauth.yml' (oauth profile).
  # To enable GitHub OAuth, either activate the 'oauth' profile or set
  # `spring.security.oauth2.client.*` properties via environment variables
  # or an external config. Avoid placing an empty registration block here
  # because Spring Boot will validate and require a non-empty client-id.
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update  # 使用 update 模式，不会自动修改列类型
      # 如果需要重新创建表，临时改为 create 或 create-drop（会删除所有数据！）
      # ddl-auto: create-drop  # 仅在需要重新创建表时使用，使用后改回 update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20               # 批处理大小
        order_inserts: true            # 排序插入
        order_updates: true            # 排序更新
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 邮件配置
  mail:
    host: smtp.office365.com
    port: 587
    username: yourname@outlook.com
    password: 16位应用专用密码
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  
  # Redis配置优化
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20                 # 连接池最大活跃连接数
        max-idle: 10                   # 最大空闲连接
        min-idle: 5                    # 最小空闲连接
        max-wait: 1000ms               # 最大等待时间




