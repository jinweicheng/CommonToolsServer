# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    root: INFO
    com.commontools.server: DEBUG
    com.commontools.server.controller: DEBUG
    com.commontools.server.config: DEBUG
    com.commontools.server.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/commontools.log

# JWT配置
jwt:
  secret: CommonToolsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000 # 24小时 (毫秒)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    oauth2:
      enabled: ${OAUTH2_ENABLED:false}
    redis-enabled: ${REDIS_ENABLED:false}

# 文件存储配置
file:
  storage:
    path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,pdf,zip,rar,7z,doc,docx,xls,xlsx,ppt,pptx,txt

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 邮件发送配置（自定义配置）
mail:
  from: chengjinweigoogle@gmail.com
  admin: chengjinweigoogle@gmail.com  # 接收反馈的邮箱地址

# 统计配置
statistics:
  enabled: true
