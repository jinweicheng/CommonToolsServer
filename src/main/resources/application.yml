# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api
  # Tomcat连接池优化
  tomcat:
    threads:
      max: 200                         # 最大线程数
      min-spare: 10                    # 最小空闲线程
    max-connections: 10000             # 最大连接数
    accept-count: 100                  # 等待队列大小

# 日志配置 - 优化避免高并发下CPU占用
logging:
  level:
    root: INFO
    com.commontools.server: INFO       # 降低日志级别，减少日志输出
    com.commontools.server.controller: INFO
    com.commontools.server.config: INFO
    com.commontools.server.security: INFO
    org.springframework.web: WARN       # 降低框架日志级别
    org.springframework.security: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.hibernate: WARN                # 降低Hibernate日志级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/commontools.log
    max-size: 100MB                    # 日志文件最大大小
    max-history: 30                    # 保留天数
    total-size-cap: 1GB                # 日志总大小上限

# JWT配置
jwt:
  secret: CommonToolsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000 # 24小时 (毫秒)

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    oauth2:
      enabled: ${OAUTH2_ENABLED:false}
    redis-enabled: ${REDIS_ENABLED:false}

# 文件存储配置
file:
  storage:
    path: ./uploads
    allowed-extensions: jpg,jpeg,png,gif,pdf,zip,rar,7z,doc,docx,xls,xlsx,ppt,pptx,txt

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 邮件发送配置（自定义配置）
mail:
  from: chengjinweigoogle@gmail.com
  admin: chengjinweigoogle@gmail.com  # 接收反馈的邮箱地址

# 统计配置 - 默认禁用以减少CPU占用，可通过环境变量启用
statistics:
  enabled: ${STATISTICS_ENABLED:false}
