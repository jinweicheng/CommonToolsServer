spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/commontools?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:commontools}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # OAuth2 configuration is managed in 'application-oauth.yml' (oauth profile).
  # To enable OAuth2 in production, set OAUTH2_ENABLED=true and provide client credentials
  # via environment variables (GOOGLE_CLIENT_ID, GITHUB_CLIENT_ID, etc.) or activate 'oauth' profile.

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000

app:
  security:
    oauth2:
      enabled: ${OAUTH2_ENABLED:false}  # Default: disabled. Only enable if env vars are provided.
    redis-enabled: ${REDIS_ENABLED:true}
